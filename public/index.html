<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Todo List</h1>
      <button id="theme-toggle" class="theme-toggle">🌙</button>
    </div>

    <div id="auth-forms">
      <form id="login-form">
        <h2>Login</h2>
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit" class="auth-btn">Login</button>
        <p class="switch-text">Don't have an account? <a href="#" id="show-register">Register</a></p>
      </form>

      <form id="reg-form" class="hidden">
        <h2>Register</h2>
        <input type="text" id="reg-name" placeholder="Name" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Password (min 6 chars)" required minlength="6">
        <button type="submit" class="auth-btn">Register</button>
        <p class="switch-text">Already have an account? <a href="#" id="show-login">Login</a></p>
      </form>
    </div>

    <div id="todo-app" class="hidden">
      <div class="user-bar">
        <span id="user-name"></span>
        <button id="logout-btn" class="logout-btn">Logout</button>
      </div>
      <div class="input-group">
        <input type="text" id="todo-input" placeholder="Add a new task..." autofocus>
        <button id="add-btn">Add</button>
      </div>
      <ul id="todo-list"></ul>
    </div>
  </div>
  <script src="js/app.js" type="module"></script>
</body>
</html>
